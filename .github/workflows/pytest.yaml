name: pytest
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: 3.8

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pipenv codecov
        pip install -r requirements.txt
        pipenv install --dev

    - name: Install bedtools
      run: |
        wget https://github.com/arq5x/bedtools2/releases/download/v2.31.0/bedtools.static -O bedtools
        chmod a+x bedtools
        sudo mv bedtools /usr/bin/bedtools

    - name: Test with pytest
      run: |
        pytest -v --cov --count 10 --random-order tests/unit/

    - name: Get test coverage % from pytest output for coverage badge
      run: |
        pytest --cov --cov-report xml tests/unit/
        coverage_raw=$(head -n2 coverage.xml | grep -Po '(?<=line-rate=\").*?(?=")')
        TOTAL=$(printf "%.2f" "$(echo "${coverage_raw} * 100" | bc -l)")
        echo "total=${TOTAL}" >> $GITHUB_ENV
        echo "### Total coverage: ${TOTAL}%" >> $GITHUB_STEP_SUMMARY
